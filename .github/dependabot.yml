version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "07:00"
      timezone: UTC
    commit-message:
      prefix: ci
    open-pull-requests-limit: 5

  - package-ecosystem: docker
    directory: /custom-image
    schedule:
      interval: weekly
      day: monday
      time: "07:15"
      timezone: UTC
    commit-message:
      prefix: build
    open-pull-requests-limit: 5
