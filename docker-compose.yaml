name: lenovo-smart-frame

services:
  immich-kiosk:
    # Pinned upstream Kiosk plus the reviewable curation, display, dependency,
    # and runtime-hardening patches in custom-image/.
    build:
      context: ./custom-image
      args:
        KIOSK_UPSTREAM_REF: ${KIOSK_UPSTREAM_REF:-v0.42.0}
        KIOSK_UPSTREAM_COMMIT: ${KIOSK_UPSTREAM_COMMIT:-2fc02e0573444de60beff43e33b93f73cf25c2af}
        KIOSK_VERSION: ${KIOSK_VERSION:-0.1.0}
    image: ${KIOSK_IMAGE:-local/immich-smart-frame:0.1.0}
    container_name: ${KIOSK_CONTAINER_NAME:-immich-kiosk}
    restart: unless-stopped
    # The application drains requests on SIGTERM. Keep this above its own
    # shutdown grace period; Docker sends SIGKILL only after this interval.
    stop_grace_period: 30s
    cpus: ${KIOSK_CPUS:-3.0}
    mem_limit: ${KIOSK_MEMORY_LIMIT:-1g}
    tty: true
    environment:
      LANG: en_US.UTF-8
      TZ: ${TZ:-Etc/UTC}
      KIOSK_IMMICH_URL: ${IMMICH_URL:?Set IMMICH_URL in .env}
      KIOSK_IMMICH_API_KEY_FILE: /run/secrets/immich_api_key
      KIOSK_LOG_LEVEL: info
    ports:
      - "${KIOSK_PORT:-3000}:3000"
    volumes:
      - ${KIOSK_CONFIG_FILE:-./config/config.yaml}:/config/config.yaml:ro
      - ./custom.css:/custom.css:ro
      - ./offline-assets:/offline-assets
    secrets:
      - immich_api_key
    cap_drop:
      - ALL
    read_only: true
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:mode=1777,noexec,nosuid,nodev
    healthcheck:
      # /livez is process liveness only. Dependency readiness is probed by the
      # external monitor so an Immich outage cannot trigger a restart loop.
      test: ["CMD", "/kiosk", "--livecheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

secrets:
  immich_api_key:
    file: ${KIOSK_API_KEY_FILE:-./secrets/immich_api_key}
