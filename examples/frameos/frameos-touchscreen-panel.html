<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#101722">
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; frame-src 'self'; script-src 'unsafe-inline'; style-src 'unsafe-inline'">
    <title>FrameOS touchscreen panel</title>
    <style>
      html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #101722; color: #f7f9fc; font-family: system-ui, sans-serif; }
      #panel { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; background: #101722; }
      #loading { position: fixed; z-index: 2; inset: 0; display: grid; place-items: center; pointer-events: none; background: radial-gradient(circle at 50% 42%, #23354d, #101722 62%); font-size: clamp(1.1rem, 2.2vw, 1.8rem); }
      #loading[hidden] { display: none; }
      #loading.still-connecting { inset: auto 1rem 1rem; width: fit-content; padding: .65rem .9rem; border: 1px solid rgba(255,255,255,.15); border-radius: .75rem; background: rgba(16,23,34,.88); font-size: 1rem; }
      #status { position: fixed; width: 1px; height: 1px; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); }
    </style>
  </head>
  <body>
    <iframe id="panel" title="FrameOS touchscreen Home Assistant panel" allow="autoplay; fullscreen" referrerpolicy="same-origin"></iframe>
    <div id="loading">Opening Home…</div>
    <p id="status" aria-live="polite" aria-atomic="true"></p>
    <script>
      (() => {
        "use strict";
        const routes = Object.freeze({
          home: "/frameos-touchscreen/home?kiosk",
          cameras: "/frameos-touchscreen/cameras?kiosk",
          calendar: "/frameos-touchscreen/calendar?kiosk",
        });
        const labels = Object.freeze({ home: "Home", cameras: "Cameras", calendar: "Calendar" });
        const readiness = Object.freeze({
          home: Object.freeze(["today", "up next", "home status", "comfort"]),
          cameras: Object.freeze(["camera chooser"]),
          calendar: Object.freeze(["ha-full-calendar"]),
        });
        const READY_TIMEOUT_MILLIS = 12_000;
        const validView = (value) => Object.prototype.hasOwnProperty.call(routes, value);
        const normalizeView = (value) => validView(value) ? value : "home";
        const routeFor = (value) => routes[normalizeView(value)];

        // Explicitly tracks one selected camera. The dashboard itself uses navigation
        // cards on its chooser and has exactly one live camera card per camera subview.
        const createCameraMountController = () => {
          let mountedCamera = null;
          return Object.freeze({
            select(camera) { mountedCamera = typeof camera === "string" && camera ? camera : null; return mountedCamera; },
            dispose() { mountedCamera = null; },
            mounted() { return mountedCamera; },
          });
        };

        window.FrameOSTouchscreenPanel = Object.freeze({ normalizeView, routeFor, createCameraMountController });

        const panel = document.getElementById("panel");
        const loading = document.getElementById("loading");
        const status = document.getElementById("status");
        let currentView = null;
        let activeWork = null;

        const announce = (message) => { status.textContent = message; };
        const focusPanel = () => { try { panel.contentWindow.focus(); } catch (_error) { panel.focus(); } };
        const showLoading = (view) => { loading.textContent = `Opening ${labels[view]}…`; loading.classList.remove("still-connecting"); loading.hidden = false; announce(`Loading ${labels[view]}`); };
        const showReady = (view) => { loading.hidden = true; announce(`${labels[view]} ready`); focusPanel(); };
        const showStillConnecting = (view) => { loading.textContent = `${labels[view]} still connecting…`; loading.classList.add("still-connecting"); loading.hidden = false; announce(`${labels[view]} still connecting`); focusPanel(); };

        const disposeRouteWork = () => {
          if (!activeWork) return;
          window.clearTimeout(activeWork.timeout);
          activeWork.observer.disconnect();
          activeWork = null;
        };

        const textFor = (element) => [element.heading, element.getAttribute?.("heading"), element.textContent].filter((value) => typeof value === "string").join(" ").toLowerCase();
        const routeReady = (view, root) => {
          if (view === "calendar") return Boolean(root.querySelector("ha-full-calendar"));
          const wanted = readiness[view];
          const headings = [...root.querySelectorAll("hui-heading-card, ha-card, h1, h2")].map(textFor);
          return wanted.every((heading) => headings.some((text) => text.includes(heading)));
        };

        const observeReadiness = (view) => {
          disposeRouteWork();
          const root = panel.contentDocument;
          if (!root) return;
          const finish = () => {
            if (!activeWork || activeWork.view !== view || !routeReady(view, root)) return;
            disposeRouteWork();
            showReady(view);
          };
          const observer = new MutationObserver(finish);
          activeWork = { view, observer, timeout: null };
          observer.observe(root, { childList: true, subtree: true });
          activeWork.timeout = window.setTimeout(() => {
            if (activeWork?.view === view) showStillConnecting(view);
          }, READY_TIMEOUT_MILLIS);
          finish();
        };

        const navigate = (rawView) => {
          const view = normalizeView(rawView);
          if (location.hash !== `#${view}`) history.replaceState(null, "", `${location.pathname}${location.search}#${view}`);
          currentView = view;
          disposeRouteWork();
          showLoading(view);
          panel.src = routeFor(view);
        };

        panel.addEventListener("load", () => { if (currentView) observeReadiness(currentView); });
        window.addEventListener("hashchange", () => navigate(location.hash.slice(1)));
        navigate(location.hash.slice(1));
      })();
    </script>
  </body>
</html>
