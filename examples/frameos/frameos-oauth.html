<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; base-uri 'none'; form-action 'none'; connect-src 'none'; img-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'"
    >
    <meta name="referrer" content="no-referrer">
    <link rel="redirect_uri" href="frameos://oauth/callback">
    <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Return to FrameOS</title>
    <style>
      :root { color-scheme: dark; font-family: system-ui, sans-serif; }
      body { display: grid; min-height: 100vh; margin: 0; place-items: center; background: #101a2d; color: #f7f8fb; }
      main { max-width: 34rem; padding: 3rem; text-align: center; }
      p { color: #d1d7e0; font-size: 1.2rem; line-height: 1.5; }
    </style>
  </head>
  <body>
    <main>
      <h1>Returning to FrameOS…</h1>
      <p id="status">Completing the secure Home Assistant connection.</p>
      <noscript>JavaScript is required to return this one-time authorization response to FrameOS.</noscript>
    </main>
    <script>
      (() => {
        "use strict";
        const source = new URL(window.location.href);
        const code = source.searchParams.get("code") || "";
        const state = source.searchParams.get("state") || "";
        history.replaceState(null, "", source.pathname);
        const failed = Boolean(source.searchParams.get("error"));
        const target = new URL("frameos://oauth/callback");
        target.searchParams.set("code", failed ? "" : code);
        target.searchParams.set("state", state);
        if (failed) target.searchParams.set("error", "authorization_failed");
        document.getElementById("status").textContent = failed
          ? "Home Assistant did not authorize this display. Return to FrameOS and try again."
          : "Authorization received. FrameOS should reopen automatically.";
        location.replace(target.toString());
      })();
    </script>
  </body>
</html>
