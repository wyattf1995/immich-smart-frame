<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#101722">
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; frame-src 'self'; script-src 'unsafe-inline'; style-src 'unsafe-inline'"
    >
    <title>FrameOS Home Assistant panel</title>
    <style>
      :root {
        color-scheme: dark;
        background: #101722;
        font-family: system-ui, sans-serif;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        overscroll-behavior: none;
        background: #101722;
      }

      #panel {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        border: 0;
        background: #101722;
      }

      #loading {
        position: fixed;
        z-index: 2;
        inset: 0;
        display: grid;
        place-items: center;
        pointer-events: none;
        background: radial-gradient(circle at 50% 42%, #23354d, #101722 62%);
        color: #f7f9fc;
        font-size: clamp(1.2rem, 2.2vw, 2rem);
        letter-spacing: 0.02em;
        opacity: 1;
        transition: opacity 180ms ease;
      }

      #loading[hidden] {
        display: none;
      }

      #loading.still-connecting {
        inset: auto 1.25rem 1.25rem;
        width: fit-content;
        min-height: 0;
        padding: 0.65rem 0.9rem;
        border: 1px solid rgba(255, 255, 255, 0.15);
        border-radius: 0.75rem;
        background: rgba(16, 23, 34, 0.84);
        font-size: clamp(0.9rem, 1.6vw, 1.2rem);
      }

      #status {
        position: fixed;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }
    </style>
  </head>
  <body tabindex="-1">
    <iframe
      id="panel"
      title="Home Assistant family display"
      allow="autoplay; fullscreen"
      referrerpolicy="same-origin"
      tabindex="0"
    ></iframe>
    <div id="loading">Opening Home…</div>
    <p id="status" aria-live="polite" aria-atomic="true"></p>
    <script>
      (() => {
        "use strict";

        const allowedViews = new Set(["home", "cameras", "calendar"]);
        const routes = Object.freeze({
          home: "/wall-panel/home?kiosk",
          cameras: "/wall-panel/cameras?kiosk",
          calendar: "/wall-panel/calendar?kiosk",
        });
        const labels = Object.freeze({
          home: "Home",
          cameras: "Cameras",
          calendar: "Calendar",
        });
        const panel = document.getElementById("panel");
        const loading = document.getElementById("loading");
        const status = document.getElementById("status");
        const ROUTE_READY_TIMEOUT_MILLIS = 12_000;
        const ROOT_SHADOW_PROBE_INTERVAL_MILLIS = 50;
        const readinessRequirements = Object.freeze({
          home: Object.freeze({
            primaryHeadings: Object.freeze(["today", "up next", "home status"]),
          }),
          cameras: Object.freeze({ cameraCards: 4, cameraPlayers: 4, cameraVideos: 4 }),
          calendar: Object.freeze({ calendarRoot: "ha-full-calendar" }),
        });
        let view = allowedViews.has(location.hash.slice(1)) ? location.hash.slice(1) : "home";
        let loadedView = null;
        let activeRouteWork = null;

        const announce = (message) => {
          status.textContent = message;
        };

        const showLoading = (nextView) => {
          loading.textContent = `Opening ${labels[nextView]}…`;
          loading.classList.remove("still-connecting");
          loading.hidden = false;
          announce(`Loading ${labels[nextView]}`);
        };

        const showStillConnecting = (nextView, detail) => {
          loading.textContent = `${labels[nextView]} still connecting${detail ? ` (${detail})` : ""}…`;
          loading.classList.add("still-connecting");
          loading.hidden = false;
          announce(`${labels[nextView]} still connecting${detail ? `: ${detail}` : ""}`);
        };

        const showReady = (readyView) => {
          loading.hidden = true;
          announce(`${labels[readyView]} ready`);
        };

        const focusPanel = () => {
          try {
            panel.contentWindow.focus();
          } catch (_error) {
            panel.focus();
          }
        };

        const normalizeLocation = (nextView) => {
          if (location.hash !== `#${nextView}`) {
            history.replaceState(null, "", `${location.pathname}${location.search}#${nextView}`);
          }
        };

        const currentPanelView = () => {
          try {
            const match = panel.contentWindow.location.pathname.match(/^\/wall-panel\/([^/]+)\/?$/);
            return match && allowedViews.has(match[1]) ? match[1] : null;
          } catch (_error) {
            return null;
          }
        };

        const isLiveObservationRoot = (root, state) => {
          if (root === state.documentRoot) return root === panel.contentDocument;
          return Boolean(root?.host && isActivePanelElement(root.host, state.documentRoot));
        };

        const pruneRouteObservers = (state) => {
          state.observers = state.observers.filter(({ root, observer }) => {
            if (isLiveObservationRoot(root, state)) return true;
            observer.disconnect();
            return false;
          });
        };

        const disconnectRouteObservers = (state) => {
          state.observers.forEach(({ observer }) => observer.disconnect());
          state.observers.length = 0;
        };

        const removeVideoListeners = (state) => {
          state.videoListeners.forEach(([video, listener]) => {
            video.removeEventListener("loadeddata", listener);
            video.removeEventListener("canplay", listener);
            video.removeEventListener("playing", listener);
          });
          state.videoListeners.length = 0;
        };

        const releaseRouteEvidence = (state) => {
          window.clearTimeout(state.rootProbeTimer);
          state.rootProbeTimer = null;
          state.pendingShadowHosts.clear();
          disconnectRouteObservers(state);
          removeVideoListeners(state);
          state.primaryHeadings.clear();
          state.calendarRoot = null;
          state.cameraCards.clear();
          state.cameraPlayers.clear();
          state.cameraVideos.clear();
          state.decodedVideos.clear();
        };

        const cancelRouteWork = () => {
          if (!activeRouteWork) return;
          window.clearTimeout(activeRouteWork.deadlineTimer);
          releaseRouteEvidence(activeRouteWork);
          activeRouteWork = null;
        };

        const isActivePanelElement = (element, documentRoot) => {
          const belongsToDocument = element && element.isConnected && element.ownerDocument === documentRoot;
          return Boolean(belongsToDocument && documentRoot === panel.contentDocument);
        };

        const pruneSet = (elements, documentRoot) => {
          elements.forEach((element) => {
            if (!isActivePanelElement(element, documentRoot)) elements.delete(element);
          });
        };

        const pruneRouteEvidence = (state) => {
          const { documentRoot } = state;
          pruneRouteObservers(state);
          state.primaryHeadings.forEach((element, heading) => {
            if (!isActivePanelElement(element, documentRoot)) state.primaryHeadings.delete(heading);
          });
          if (!isActivePanelElement(state.calendarRoot, documentRoot)) state.calendarRoot = null;
          [state.cameraCards, state.cameraPlayers, state.cameraVideos].forEach((elements) => {
            pruneSet(elements, documentRoot);
          });
          state.decodedVideos.forEach((video) => {
            if (!isActivePanelElement(video, documentRoot) || !cameraVideoIsDecoded(video)) {
              state.decodedVideos.delete(video);
            }
          });
          state.videoListeners = state.videoListeners.filter(([video, listener]) => {
            if (isActivePanelElement(video, documentRoot)) return true;
            video.removeEventListener("loadeddata", listener);
            video.removeEventListener("canplay", listener);
            video.removeEventListener("playing", listener);
            return false;
          });
        };

        const headingText = (element) => {
          const candidates = [
            element.heading,
            element.getAttribute("heading"),
            element._config?.heading,
            element.textContent,
            element.shadowRoot?.textContent,
          ];
          return candidates.filter((candidate) => typeof candidate === "string").join(" ").toLowerCase();
        };

        const applyHeadingContrast = (element, state) => {
          if (state.view !== "home" || element.localName !== "hui-heading-card") return;
          if (!state.styledHeadings.has(element)) {
            element.style.setProperty(
              "background",
              "linear-gradient(90deg, rgba(9, 15, 24, 0.82), rgba(9, 15, 24, 0.58))",
              "important",
            );
            element.style.setProperty("border-radius", "14px", "important");
            element.style.setProperty("box-shadow", "inset 0 0 0 1px rgba(255,255,255,.1)", "important");
            element.style.setProperty("--primary-text-color", "#fff", "important");
            element.style.setProperty("--secondary-text-color", "rgba(255,255,255,.92)", "important");
            state.styledHeadings.add(element);
          }
          if (element.shadowRoot && !state.styledHeadingShadows.has(element.shadowRoot)) {
            const style = element.ownerDocument.createElement("style");
            style.id = "frameos-heading-contrast";
            style.textContent = ":host,*{color:#fff!important;text-shadow:0 1px 3px rgba(0,0,0,.9)}";
            element.shadowRoot.append(style);
            state.styledHeadingShadows.add(element.shadowRoot);
          }
        };

        const cameraVideoIsDecoded = (video) => Number(video.readyState) >= 2;

        const updateCameraVideo = (video, state) => {
          if (state.ready || !isActivePanelElement(video, state.documentRoot)) return;
          state.decodedVideos.add(video);
          evaluateRouteReadiness(state);
        };

        const observeRoot = (root, state) => {
          if (state.observedRoots.has(root)) return;
          state.observedRoots.add(root);
          const observer = new MutationObserver((records) => {
            if (activeRouteWork !== state || view !== state.view) return;
            pruneRouteEvidence(state);
            records.forEach((record) => {
              record.addedNodes.forEach((node) => inspectAddedSubtree(node, state));
            });
          });
          observer.observe(root, { childList: true, subtree: true });
          state.observers.push({ root, observer });
        };

        const inspectElement = (element, state) => {
          if (!isActivePanelElement(element, state.documentRoot)) return;
          if (element.shadowRoot) {
            state.pendingShadowHosts.delete(element);
            observeRoot(element.shadowRoot, state);
            inspectAddedSubtree(element.shadowRoot, state);
          } else if (!state.ready && element.localName.includes("-")) {
            state.pendingShadowHosts.add(element);
            schedulePendingShadowRootProbe(state);
          }
          if (state.view === "home" && element.localName === "hui-heading-card") {
            applyHeadingContrast(element, state);
            if (!state.ready) {
              readinessRequirements.home.primaryHeadings.forEach((heading) => {
                if (headingText(element).includes(heading)) state.primaryHeadings.set(heading, element);
              });
            }
          }
          if (!state.ready && state.view === "calendar" && element.localName === readinessRequirements.calendar.calendarRoot) {
            state.calendarRoot = element;
          }
          if (state.ready || state.view !== "cameras") return;
          if (element.localName === "hui-picture-entity-card") state.cameraCards.add(element);
          if (element.localName === "ha-web-rtc-player") state.cameraPlayers.add(element);
          if (element.localName !== "video") return;
          state.cameraVideos.add(element);
          if (cameraVideoIsDecoded(element)) state.decodedVideos.add(element);
          if (state.observedVideos.has(element)) return;
          const listener = () => updateCameraVideo(element, state);
          state.observedVideos.add(element);
          state.videoListeners.push([element, listener]);
          element.addEventListener("loadeddata", listener);
          element.addEventListener("canplay", listener);
          element.addEventListener("playing", listener);
        };

        const inspectAddedSubtree = (node, state) => {
          if (!node || (node.nodeType !== 1 && node.nodeType !== 9 && node.nodeType !== 11)) return;
          if (node.nodeType === 1) inspectElement(node, state);
          if (!node.querySelectorAll) return;
          node.querySelectorAll("*").forEach((element) => inspectElement(element, state));
          evaluateRouteReadiness(state);
        };

        const schedulePendingShadowRootProbe = (state) => {
          if (
            activeRouteWork !== state ||
            state.ready ||
            state.rootProbeTimer !== null ||
            state.pendingShadowHosts.size === 0
          ) return;
          state.rootProbeTimer = window.setTimeout(() => {
            state.rootProbeTimer = null;
            if (activeRouteWork !== state || state.ready) return;
            state.pendingShadowHosts.forEach((host) => {
              if (!isActivePanelElement(host, state.documentRoot)) {
                state.pendingShadowHosts.delete(host);
              } else if (host.shadowRoot) {
                state.pendingShadowHosts.delete(host);
                observeRoot(host.shadowRoot, state);
                inspectAddedSubtree(host.shadowRoot, state);
              }
            });
            schedulePendingShadowRootProbe(state);
          }, ROOT_SHADOW_PROBE_INTERVAL_MILLIS);
        };

        const cameraConnectionDetail = (state) => {
          pruneRouteEvidence(state);
          const requirement = readinessRequirements.cameras;
          const decoded = `${state.decodedVideos.size}/${requirement.cameraVideos} decoded`;
          return `${state.cameraCards.size}/${requirement.cameraCards} cards, ${state.cameraPlayers.size}/${requirement.cameraPlayers} players, ${decoded}`;
        };

        const routeHasContent = (state) => {
          pruneRouteEvidence(state);
          if (currentPanelView() !== state.view) return false;
          if (state.view === "home") {
            return state.primaryHeadings.size === readinessRequirements.home.primaryHeadings.length;
          }
          if (state.view === "calendar") return Boolean(state.calendarRoot);
          const requirement = readinessRequirements.cameras;
          const cameraStructureReady = state.cameraCards.size >= requirement.cameraCards &&
            state.cameraPlayers.size >= requirement.cameraPlayers;
          const decodedVideoReady = state.cameraVideos.size >= requirement.cameraVideos &&
            state.decodedVideos.size >= requirement.cameraVideos;
          return cameraStructureReady && decodedVideoReady;
        };

        const finishRouteReady = (state) => {
          if (activeRouteWork !== state || state.ready) return;
          state.ready = true;
          window.clearTimeout(state.rootProbeTimer);
          state.rootProbeTimer = null;
          state.pendingShadowHosts.clear();
          window.clearTimeout(state.deadlineTimer);
          state.deadlineTimer = null;
          showReady(state.view);
          focusPanel();
          if (state.view === "home") {
            // The long-lived Home observer only needs weak contrast bookkeeping.
            state.primaryHeadings.clear();
          } else {
            releaseRouteEvidence(state);
          }
        };

        const evaluateRouteReadiness = (state) => {
          if (activeRouteWork !== state || state.ready) return;
          if (routeHasContent(state)) finishRouteReady(state);
        };

        const waitForRouteReady = (readyView) => {
          cancelRouteWork();
          let documentRoot;
          try {
            documentRoot = panel.contentDocument;
          } catch (_error) {
            return;
          }
          if (!documentRoot) return;

          const state = {
            view: readyView,
            ready: false,
            deadlineTimer: null,
            rootProbeTimer: null,
            observers: [],
            observedRoots: new WeakSet(),
            pendingShadowHosts: new Set(),
            styledHeadings: new WeakSet(),
            styledHeadingShadows: new WeakSet(),
            primaryHeadings: new Map(),
            calendarRoot: null,
            cameraCards: new Set(),
            cameraPlayers: new Set(),
            cameraVideos: new Set(),
            decodedVideos: new Set(),
            observedVideos: new WeakSet(),
            videoListeners: [],
            documentRoot,
          };
          activeRouteWork = state;
          state.deadlineTimer = window.setTimeout(() => {
            if (activeRouteWork !== state || state.ready) return;
            window.clearTimeout(state.rootProbeTimer);
            state.rootProbeTimer = null;
            state.pendingShadowHosts.clear();
            const detail = state.view === "cameras" ? cameraConnectionDetail(state) : "content is still loading";
            showStillConnecting(state.view, detail);
            focusPanel();
          }, ROUTE_READY_TIMEOUT_MILLIS);
          observeRoot(documentRoot, state);
          // The initial document gets one bounded traversal. Afterwards each
          // observer only inspects the subtree that Home Assistant just added.
          inspectAddedSubtree(documentRoot, state);
          schedulePendingShadowRootProbe(state);
        };

        const navigatePanel = (nextView) => {
          cancelRouteWork();
          if (loadedView === nextView) {
            waitForRouteReady(nextView);
            return;
          }

          showLoading(nextView);
          const nextPath = routes[nextView];
          try {
            const childWindow = panel.contentWindow;
            const homeAssistant = panel.contentDocument.querySelector("home-assistant");
            const isWallPanel = childWindow.location.pathname.startsWith("/wall-panel/");
            if (homeAssistant?.shadowRoot && isWallPanel) {
              childWindow.history.pushState(null, "", nextPath);
              childWindow.dispatchEvent(new childWindow.Event("location-changed"));
              loadedView = nextView;
              waitForRouteReady(nextView);
              return;
            }
          } catch (_error) {
            // Login and startup pages intentionally use one full same-origin navigation.
          }

          loadedView = null;
          panel.src = nextPath;
        };

        const showView = (nextView) => {
          const normalizedView = allowedViews.has(nextView) ? nextView : "home";
          view = normalizedView;
          normalizeLocation(normalizedView);
          navigatePanel(normalizedView);
        };

        panel.addEventListener("load", () => {
          const current = currentPanelView();
          if (!current) {
            try {
              if (panel.contentWindow.location.href === "about:blank") return;
            } catch (_error) {
              // A non-panel navigation is handled as a sign-in or recovery page below.
            }
            loading.hidden = true;
            announce("Home Assistant ready for sign-in");
            focusPanel();
            return;
          }

          loadedView = current;
          if (current !== view) {
            navigatePanel(view);
            return;
          }
          waitForRouteReady(current);
        });

        window.addEventListener("hashchange", () => {
          showView(location.hash.slice(1));
        });

        showView(view);
      })();
    </script>
  </body>
</html>
