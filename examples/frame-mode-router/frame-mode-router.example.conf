# Copy this file to /data/local/tmp/frame-mode-router.conf on the frame, then
# replace only the three example URLs. Keep the active copy private.
STATE_FILE='/data/local/tmp/frame-mode-router.state'
LOCK_DIR='/data/local/tmp/frame-mode-router.lock'

HOME_URL='https://home-assistant.example.invalid/wall-panel/home?kiosk'
CAMERAS_URL='https://home-assistant.example.invalid/wall-panel/cameras?kiosk'
CALENDAR_URL='https://home-assistant.example.invalid/wall-panel/calendar?kiosk'

FULLY_ACTIVITY='de.ozerov.fully/.FullyActivity'
FIREFOX_PACKAGE='org.mozilla.firefox'

# Optional FrameOS path. Leave both empty to preserve the Fully + Firefox
# fallback. Set both after installing FrameOS to add native Weather and keep all
# five modes inside the app through its android.permission.DUMP-protected bridge.
FRAMEOS_PACKAGE=''
FRAMEOS_RECEIVER=''
