# Copy this file to /data/local/tmp/frame-mode-router.conf on the frame, then
# replace only the three example URLs. Keep the active copy private.
STATE_FILE='/data/local/tmp/frame-mode-router.state'
LOCK_DIR='/data/local/tmp/frame-mode-router.lock'
# A dead shell's file lock is reclaimed only after this lease. A live owner is
# never displaced, even after the lease, so keep this above Key Mapper's 30s
# command timeout.
LOCK_LEASE_SECONDS='90'

HOME_URL='https://home-assistant.example.invalid/wall-panel/home?kiosk'
CAMERAS_URL='https://home-assistant.example.invalid/wall-panel/cameras?kiosk'
CALENDAR_URL='https://home-assistant.example.invalid/wall-panel/calendar?kiosk'

FULLY_ACTIVITY='de.ozerov.fully/.FullyActivity'
FIREFOX_PACKAGE='org.mozilla.firefox'

# Firefox's toolbar-collapse swipe waits only for a resumed activity. The
# default is one immediate probe plus up to three one-second retries.
FIREFOX_READY_MAX_PROBES='4'
FIREFOX_READY_POLL_SECONDS='1'

# Optional FrameOS path. Leave both empty to preserve the Fully + Firefox
# fallback. Set all three after installing FrameOS to add native Weather and keep all
# configured modes inside the app through its android.permission.DUMP-protected bridge.
FRAMEOS_PACKAGE=''
FRAMEOS_ACTIVITY=''
FRAMEOS_RECEIVER=''

# Set to 1 only after provisioning FrameOS with a safe frameos.birds_url. Leaving
# this disabled preserves the existing five-mode cycle during upgrades.
FRAMEOS_BIRDS_ENABLED='0'
