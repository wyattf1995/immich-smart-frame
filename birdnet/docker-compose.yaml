services:
  birdnet-go:
    # Stable release manifest, pinned so an unattended pull cannot change it.
    # Digest verified from the GHCR registry on 2026-08-31.
    image: ghcr.io/tphakala/birdnet-go:20260823@sha256:233b94f1d3b27b261ec8d997364db0cb953f3e3b3362a89e9e22ad4a589143d6
    container_name: birdnet-go
    restart: unless-stopped
    networks:
      - default
      - nest-audio

    # Bind to the address supplied by the operator. Use a concrete Unraid LAN
    # address in .env; Compose validates presence, not the address class.
    ports:
      - "${BIRDNET_BIND_IP:?Set BIRDNET_BIND_IP to an Unraid LAN address}:${WEB_PORT:-8088}:8080"

    environment:
      TZ: "${TZ:-UTC}"
      BIRDNET_UID: "${BIRDNET_UID:-1000}"
      BIRDNET_GID: "${BIRDNET_GID:-1000}"

    # Run directly as the configured unprivileged ID. This keeps read_only:
    # true compatible with the upstream entrypoint's rootless path; prepare
    # the bind-mount ownership on Unraid before starting the service.
    user: "${BIRDNET_UID:-1000}:${BIRDNET_GID:-1000}"

    volumes:
      - "${BIRDNET_CONFIG_DIR:?Set BIRDNET_CONFIG_DIR to the persistent appdata config path}:/config"
      - "${BIRDNET_DATA_DIR:?Set BIRDNET_DATA_DIR to the persistent appdata data path}:/data"

    # The application writes temporary HLS segments and its startup log here.
    # Both mounts are disposable; detections, models, and configuration remain
    # in the two persistent bind mounts above.
    tmpfs:
      - /config/hls:exec,size=50M,uid=${BIRDNET_UID:-1000},gid=${BIRDNET_GID:-1000},mode=0755
      - /tmp:exec,size=16M,mode=1777

    # The bind mounts must already be writable by BIRDNET_UID:BIRDNET_GID.
    # The upstream entrypoint supports this rootless/container-user path.
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

    healthcheck:
      # /health is explicitly unauthenticated in BirdNET-Go and returns JSON.
      test: ["CMD-SHELL", "curl -fs --connect-timeout 2 --max-time 3 http://127.0.0.1:8080/health | jq -e '.status == \"healthy\"' >/dev/null"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 45s
    stop_grace_period: 30s

  birdnet-frame-view:
    # Unprivileged NGINX 1.31.3 / Alpine 3.24 manifest, verified 2026-08-31.
    # It serves one static kiosk page and a fail-closed read-only API proxy.
    image: ghcr.io/nginx/nginx-unprivileged:1.31.3-alpine3.24@sha256:f972e5322b9797dc2a6b830030094426437b1ae7032e4644496395336ac6fdac
    container_name: birdnet-frame-view
    restart: unless-stopped
    depends_on:
      birdnet-go:
        condition: service_healthy

    ports:
      - "${BIRDNET_BIND_IP:?Set BIRDNET_BIND_IP to an Unraid LAN address}:${FRAME_VIEW_PORT:-8091}:8080"

    # The upstream image defaults to UID/GID 101; make that boundary explicit.
    user: "101:101"
    volumes:
      # Unraid's FAT boot filesystem presents copied files as root-only. Keep
      # the reviewed source on boot, but mount its readable runtime copy from
      # appdata so the unprivileged NGINX worker can open it.
      - "${BIRDNET_FRAME_VIEW_DIR:-/mnt/user/appdata/birdnet-go/frame-view}/index.html:/usr/share/nginx/html/index.html:ro"
      - "${BIRDNET_FRAME_VIEW_DIR:-/mnt/user/appdata/birdnet-go/frame-view}/nginx.conf:/etc/nginx/conf.d/default.conf:ro"
    tmpfs:
      - /tmp:size=16M,uid=101,gid=101,mode=1777

    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

    healthcheck:
      # Check the same read path the frame needs, not only NGINX liveness.
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8080/api/v2/health | grep -q '\"status\":\"healthy\"'"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    stop_grace_period: 10s

  nest-audio-bridge:
    # Opt-in only: starting the normal BirdNET stack does not open a camera.
    # The local image patches go2rtc v1.9.14 for HA's current subscription API.
    profiles: ["nest-audio"]
    build:
      context: ./nest-audio-bridge
      dockerfile: Dockerfile
    image: local/nest-audio-bridge:go2rtc-1.9.14-ha2026.8
    container_name: nest-audio-bridge
    restart: unless-stopped

    # Match the protected host credential owner. The token is a mounted Docker
    # secret, never an environment variable or command-line argument.
    user: "${BIRDNET_UID:-99}:${BIRDNET_GID:-100}"
    environment:
      CREDENTIALS_DIRECTORY: /run/secrets
      HA_HOST: "${HA_HOST:-192.0.2.30}"
      HA_CAMERA_ENTITY: "${HA_CAMERA_ENTITY:-camera.backyard_camera}"
    secrets:
      - source: ha_token
        target: HA_TOKEN

    # There is deliberately no host port. BirdNET is the bridge's only local
    # consumer, over this isolated Docker network.
    networks:
      - nest-audio
    tmpfs:
      - /config:size=1M,uid=${BIRDNET_UID:-99},gid=${BIRDNET_GID:-100},mode=0700
      - /tmp:exec,size=32M,uid=${BIRDNET_UID:-99},gid=${BIRDNET_GID:-100},mode=0700
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

    healthcheck:
      # Listener readiness only; the camera remains lazy until BirdNET connects.
      test: ["CMD-SHELL", "nc -z 127.0.0.1 8554"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    stop_grace_period: 15s

secrets:
  ha_token:
    file: "${HA_TOKEN_FILE:-/mnt/user/appdata/birdnet-go/secrets/HA_TOKEN}"

networks:
  nest-audio:
    # Isolated membership and no published bridge port keep ingress private;
    # outbound access remains available for HA signaling and Nest ICE relays.
    internal: false
