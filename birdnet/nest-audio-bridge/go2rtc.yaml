# yaml-language-server: $schema=https://raw.githubusercontent.com/AlexxIT/go2rtc/v1.9.14/website/schema.json
# The Home Assistant token is loaded from /run/secrets/HA_TOKEN through
# CREDENTIALS_DIRECTORY. Never replace the placeholders in this tracked file.

app:
  # Fail closed: unnamed core modules plus these two are sufficient for the
  # private audio bridge. In particular, API, WebRTC, and SRTP never initialize.
  modules: [rtsp, hass]

api:
  # No web UI or mutation API is needed for the BirdNET bridge.
  listen: ""

rtsp:
  # This listener exists only on the isolated, unpublished Compose network.
  listen: ":8554"
  default_query: audio

webrtc:
  # The Nest source creates its own outbound WebRTC peer; it does not need a
  # downstream WebRTC server listener.
  listen: ""

srtp:
  listen: ""

log:
  format: text
  level: info

streams:
  # Keep exactly one camera source active. Home Assistant owns Nest OAuth and
  # renews the wire-powered WebRTC session while this websocket stays open.
  # Expose its native Opus track directly; BirdNET's own FFmpeg path performs
  # the well-tested decode, resample, and stereo-to-mono conversion.
  nest_camera:
    - "hass://${HA_HOST}?entity_id=${HA_CAMERA_ENTITY}&token=${HA_TOKEN}"
