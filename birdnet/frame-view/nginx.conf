limit_req_zone $binary_remote_addr zone=frame_api:1m rate=5r/s;

server {
    listen 8080 default_server;
    listen [::]:8080 default_server;
    server_name _;

    access_log off;
    error_log /dev/stderr warn;
    root /usr/share/nginx/html;

    add_header Content-Security-Policy "default-src 'none'; base-uri 'none'; connect-src 'self'; font-src 'none'; form-action 'none'; frame-ancestors 'none'; img-src 'self' data:; media-src 'self'; object-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'" always;
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;

    location = /healthz {
        access_log off;
        default_type text/plain;
        limit_except GET {
            deny all;
        }
        return 200 "ok\n";
    }

    location = / {
        try_files /index.html =404;
    }

    location = /index.html {
        try_files /index.html =404;
    }

    # Only the read-only endpoints used by the kiosk are reachable through the
    # sidecar. Query strings are preserved, but arbitrary BirdNET API paths and
    # every non-GET method fail closed.
    location ~ ^/api/v2/(health|analytics/(?:species/(?:daily|summary)|time/(?:hourly|daily)|sun)|detections/(?:recent|stream|[0-9]+)|streams/(?:audio-level|sources)|audio/[0-9]+|spectrogram/[0-9]+)$ {
        limit_except GET {
            deny all;
        }
        limit_req zone=frame_api burst=20 nodelay;

        proxy_pass http://birdnet-go:8080;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header Authorization "";
        proxy_set_header Cookie "";
        proxy_set_header Proxy-Authorization "";
        proxy_set_header X-Api-Key "";
        proxy_set_header X-CSRF-Token "";
        proxy_set_header X-Forwarded-For "";
        proxy_set_header X-Forwarded-Proto $scheme;
        # Audio uses HTTP Range requests for native seek controls. These are
        # still GET-only and the numeric route cannot expose a filesystem path.
        proxy_set_header Range $http_range;
        proxy_set_header If-Range $http_if_range;
        proxy_set_header Accept-Encoding "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        proxy_send_timeout 15s;

        proxy_hide_header Access-Control-Allow-Credentials;
        proxy_hide_header Access-Control-Allow-Origin;
        proxy_hide_header Content-Security-Policy;
        proxy_hide_header Set-Cookie;
        proxy_hide_header X-Frame-Options;
    }

    # Successful species assets are immutable enough to retain BirdNET-Go's
    # month-long cache behavior. Cold-provider 503 responses are not cached.
    location ~ ^/api/v2/media/species-image(?:/info)?$ {
        limit_except GET {
            deny all;
        }
        limit_req zone=frame_api burst=20 nodelay;

        proxy_pass http://birdnet-go:8080;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header Authorization "";
        proxy_set_header Cookie "";
        proxy_set_header Proxy-Authorization "";
        proxy_set_header X-Api-Key "";
        proxy_set_header X-CSRF-Token "";
        proxy_set_header X-Forwarded-For "";
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache off;

        proxy_hide_header Access-Control-Allow-Credentials;
        proxy_hide_header Access-Control-Allow-Origin;
        proxy_hide_header Cache-Control;
        proxy_hide_header Content-Security-Policy;
        proxy_hide_header Set-Cookie;
        proxy_hide_header X-Frame-Options;

        add_header Cache-Control "public, max-age=2592000";
        add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
    }

    location /api/ {
        return 404;
    }

    location / {
        return 404;
    }
}
