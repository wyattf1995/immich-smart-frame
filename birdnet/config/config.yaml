# yaml-language-server: $schema=https://raw.githubusercontent.com/tphakala/birdnet-go/20260823/config.schema.json
# Safe starting configuration for the Lenovo Smart Frame bird view.
#
# This file deliberately has no active audio source. Add an RTSP source only
# after confirming that it is a local, stable audio endpoint. Do not commit a
# URL containing a real username, password, or access token.

birdnet:
  latitude: 0
  longitude: 0
  modelregion: global
  sensitivity: 1.0
  threshold: 0.8
  overlap: 1.5
  threads: 0
  usexnnpack: true

realtime:
  interval: 15
  processingtime: false
  audio:
    # RTSP is configured below, so no host sound card is required.
    sources: []
    export:
      enabled: true
      path: /data/clips/
      # Opus materially reduces the retained household-audio footprint.
      type: opus
      retention:
        # Age is deterministic: clips cannot remain merely because disk is free.
        policy: age
        maxage: 30d
        minclips: 10
        keepspectrograms: true
        checkinterval: 15
  dashboard:
    thumbnails:
      # Show a compact visual reference beside species names. BirdNET-Go keeps
      # provider attribution in the dashboard rather than bundling images here.
      summary: true
      recent: true
      imageprovider: avicommons
      fallbackpolicy: all
  rtsp:
    # Keep this empty until a real microphone/camera is selected.
    streams: []
    # Nest bridge example. Add this block to the private appdata copy only
    # after its one-camera probe passes:
    # - name: Nest Backyard
    #   url: rtsp://nest-audio-bridge:8554/nest_camera?audio=opus
    #   enabled: true
    #   type: rtsp
    #   transport: tcp
    #   mediaMode: audio-only
    #   channelMode: downmix
    #   models: [birdnet]
    # Generic RTSP example. Replace every placeholder locally:
    # - name: Backyard microphone
    #   url: rtsp://RTSP_USER:RTSP_PASSWORD@192.0.2.20:554/audio
    #   type: rtsp
    #   transport: tcp
    # BirdNET-Go 20260823 uses this global transport in its FFmpeg engine.
    transport: tcp
    health:
      healthydatathreshold: 60
      monitoringinterval: 30
  telemetry:
    enabled: false
  monitoring:
    enabled: true
    checkinterval: 60
    cpu:
      enabled: true
    memory:
      enabled: true
    disk:
      enabled: true
      paths:
        - /data

webserver:
  enabled: true
  port: "8080"
  allowembedding: false

security:
  # The service is LAN-only by default. Configure authentication in the
  # BirdNET-Go UI before adding a reverse proxy, tunnel, or wider exposure.
  host: ""
  baseurl: ""
  autoTls: false
  redirecttohttps: false
  basicauth:
    enabled: false
