title: Frame Companion
views:
  - title: Frame
    cards:
      - type: entities
        title: Frame health
        entities:
          - sensor.frame_companion
          - sensor.frame_last_photo
          - sensor.frame_last_weather
          - sensor.frame_last_visible_render
          - sensor.frame_recovery_count
          - sensor.frame_last_failure
          - sensor.frame_reserve_count
          - sensor.frame_version
          - sensor.frame_command_acknowledgement
      - type: entities
        title: Photo and audio services
        entities:
          - binary_sensor.frame_server_telemetry_fresh
          - sensor.frame_services
          - sensor.frame_audio_last_received
          - sensor.frame_audio_age
          - sensor.frame_kiosk_restarts
          - sensor.frame_birdnet_restarts
          - sensor.frame_audio_bridge_restarts
      - type: entities
        title: Morning scene
        entities:
          - input_boolean.frame_morning_scene_enabled
          - input_datetime.frame_morning_scene_time
          - input_select.frame_morning_scene_choice
      - type: horizontal-stack
        cards:
          - type: button
            name: Previous
            tap_action: {action: perform-action, perform_action: script.frame_previous}
          - type: button
            name: Next
            tap_action: {action: perform-action, perform_action: script.frame_next}
          - type: button
            name: Pause
            tap_action: {action: perform-action, perform_action: script.frame_pause}
          - type: button
            name: Resume
            tap_action: {action: perform-action, perform_action: script.frame_resume}
      - type: button
        name: Hold for 10 minutes
        tap_action: {action: perform-action, perform_action: script.frame_hold_600}
