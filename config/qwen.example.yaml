# Optional advanced example for libraries tagged with the Qwen taxonomy
# described in docs/curation.md. The Immich URL comes from KIOSK_IMMICH_URL in
# docker-compose.yaml; the API key is mounted as a Docker secret.

# Frame-friendly defaults. Photo sources remain URL-selectable so each frame
# can have several mixes without rebuilding this container.
duration: 45
disable_screensaver: true
optimize_images: true
use_gpu: true
show_archived: false
album_order: random

# Optional hard exclusions from the example Qwen taxonomy. Remove or rename
# these paths to match the tags that exist in your Immich library.
excluded_tags:
  - "Things/ProductListing"
  - "Things/Electronics"
  - "Things/Book"
  - "Things/Sign"
  - "Activity/DIYProject"
  - "Style/Timelapse"
  - "Skip/**"

# Keep backend caches and date candidate pools alive for an hour instead of the
# 5-minute floor, so recently served photos stay out of the immediate remix.
cache_duration: 3600

# Positive-source curation. The selected profile replaces album=all and other
# source buckets. In balanced, 50% of selections come from an overlapping
# recency ladder whose final rung spans the whole library, so every photo
# stays reachable while recent photos are strongly boosted. The remaining 50%
# is an evergreen Qwen/face mix. Hard tag exclusions still apply to every
# source. Weights are direct relative probabilities and sum to 100 per profile.
curation_profile: balanced
curation:
  profiles:
    balanced:
      sources:
        # Overlapping recency ladder (50%). A new photo is eligible through
        # every rung, so its boost decays with age; the all-time rung keeps
        # the entire library reachable.
        - { type: date, value: "last-30", weight: 8 }
        - { type: date, value: "last-90", weight: 12 }
        - { type: date, value: "last-180", weight: 10 }
        - { type: date, value: "last-730", weight: 10 }
        - { type: date, value: "1900-01-01_to_today", weight: 10 }

        # Family (22%).
        - { type: person, value: all, weight: 8 }
        - { type: tag, value: "People/Family", weight: 7 }
        - { type: tag, value: "People/Baby", weight: 4 }
        - { type: tag, value: "People/Child", weight: 3 }

        # Photography (14%).
        - { type: tag, value: "Style/Landscape", weight: 5 }
        - { type: tag, value: "Style/Astrophotography", weight: 3 }
        - { type: tag, value: "Scene/Mountains", weight: 2 }
        - { type: tag, value: "Light/Sunset", weight: 2 }
        - { type: tag, value: "Scene/Canyon", weight: 1 }
        - { type: tag, value: "Light/GoldenHour", weight: 1 }

        # Anchors (14%).
        - { type: tag, value: "Animals/Dog", weight: 3 }
        - { type: tag, value: "Activity/Travel", weight: 3 }
        - { type: tag, value: "Event/Wedding", weight: 2 }
        - { type: tag, value: "Event/Holiday", weight: 2 }
        - { type: tag, value: "People/Portrait", weight: 2 }
        - { type: memories, weight: 2 }

      # Optional soft de-ranking keeps an album eligible but accepts matching
      # candidates less often. Keep real album IDs only in config/config.yaml.
      # album_penalties:
      #   - { album: "replace-with-your-private-album-id", factor: 0.20 }

    family:
      sources:
        - { type: person, value: all, weight: 35 }
        - { type: tag, value: "People/Family", weight: 25 }
        - { type: tag, value: "People/Child", weight: 10 }
        - { type: tag, value: "People/Baby", weight: 10 }
        - { type: tag, value: "Animals/Dog", weight: 10 }
        - { type: tag, value: "Event/Holiday", weight: 5 }
        - { type: memories, weight: 5 }

    photography:
      sources:
        - { type: tag, value: "Style/Landscape", weight: 20 }
        - { type: tag, value: "Light/Sunset", weight: 15 }
        - { type: tag, value: "Light/GoldenHour", weight: 10 }
        - { type: tag, value: "Style/Macro", weight: 15 }
        - { type: tag, value: "Style/Astrophotography", weight: 15 }
        - { type: tag, value: "Style/LongExposure", weight: 10 }
        - { type: tag, value: "Animals/Wildlife", weight: 10 }
        - { type: tag, value: "Scene/Ocean", weight: 5 }

frameless: true
hide_cursor: true
background_blur: true
background_blur_amount: 10
layout: single
transition: fade
fade_transition_duration: 1

image_fit: contain
image_effect: none
# Fetch the original on the NAS, then optimize_images downsamples it to the
# Fully Kiosk-reported physical display size before sending it to the frame.
use_original_image: true
show_videos: false
live_photos: false
show_animated_gifs: false

show_more_info: false
show_more_info_image_link: false
show_more_info_qr_code: false

# Show the exact capture date plus location in the lower-left metadata. A date
# already represented at the start of a visible album title is not repeated.
# Country is redundant for this library; city and state remain visible when
# available.
show_image_date: true
image_date_format: YYYY-MM-DD
show_image_location: true
image_location:
  hide_city: false
  hide_state: false
  hide_country: true

# Persist a bounded fallback pool. It is refreshed single-flight after live
# selections and served automatically when Immich becomes unavailable.
offline_mode:
  enabled: true
  number_of_assets: 100
  parallel_downloads: 1
  max_size: 750MB
  expiration_hours: 168

kiosk:
  port: 3000
  behind_proxy: false
  disable_url_queries: false
  disable_config_endpoint: true
  enable_url_builder: false
  watch_config: true
  # 150 bounds decoded candidate-pool memory while retaining ample variety.
  fetched_assets_size: 150
  # Widen a last-N date window when a refill returns fewer candidates than
  # this floor (0 disables). 120 suits a 150-asset fetch size.
  date_pool_minimum: 120
  # Pick a random capture hour before picking a photo inside it, so one
  # burst shoot cannot monopolize a date pool.
  date_pool_session_spread: true
  http_timeout: 20
  cache: true
  prefetch: true
  asset_weighting: true
  debug_verbose: false
