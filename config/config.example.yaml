# Starter configuration with no dependency on custom albums, tags, or named
# people. The Immich URL and API key are supplied by Docker Compose.

duration: 45
# Keep backend caches and date candidate pools alive for an hour instead of
# the 5-minute floor, so recently served photos stay out of the immediate mix.
cache_duration: 3600
disable_screensaver: true
optimize_images: true
use_gpu: true
show_archived: false
album_order: random

# This starter profile favors recent captures while retaining an all-time path.
# The ranges overlap intentionally, so the effective boost decays with age.
curation_profile: recent
curation:
  profiles:
    recent:
      sources:
        - { type: date, value: "last-30", weight: 40 }
        - { type: date, value: "last-180", weight: 25 }
        - { type: date, value: "last-730", weight: 15 }
        - { type: date, value: "1900-01-01_to_today", weight: 10 }
        - { type: memories, weight: 10 }

frameless: true
hide_cursor: true
background_blur: true
background_blur_amount: 10
layout: single
transition: fade
fade_transition_duration: 1

image_fit: contain
image_effect: none
use_original_image: true
show_videos: false
live_photos: false
show_animated_gifs: false

show_more_info: false
show_more_info_image_link: false
show_more_info_qr_code: false

# Exact capture date plus city/state when Immich has location metadata. The
# slide date is hidden when a visible album title starts with the same date.
show_image_date: true
image_date_format: YYYY-MM-DD
show_image_location: true
image_location:
  hide_city: false
  hide_state: false
  hide_country: true

# Persist a bounded fallback pool. It is refreshed single-flight after live
# selections and served automatically when Immich becomes unavailable.
offline_mode:
  enabled: true
  number_of_assets: 100
  parallel_downloads: 1
  max_size: 750MB
  expiration_hours: 168

kiosk:
  # Enable only with the companion tagging pipeline; holds unclassified imports.
  require_ai_caption: false
  port: 3000
  behind_proxy: false
  disable_url_queries: false
  disable_config_endpoint: true
  enable_url_builder: false
  watch_config: true
  # 150 bounds decoded candidate-pool memory while retaining ample variety.
  fetched_assets_size: 150
  # Widen a last-N date window when a refill returns fewer candidates than
  # this floor (0 disables). 120 suits a 150-asset fetch size.
  date_pool_minimum: 120
  # Pick a random capture hour before picking a photo inside it, so one
  # burst shoot cannot monopolize a date pool.
  date_pool_session_spread: true
  http_timeout: 20
  cache: true
  prefetch: true
  asset_weighting: true
  debug_verbose: false
